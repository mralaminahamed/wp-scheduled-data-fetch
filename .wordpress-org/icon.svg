<?xml version="1.0" encoding="UTF-8"?>
<!--
  WP Scheduled Data Fetch — icon master

  A clock with an arrow coming down out of it. The two facts about the plugin are when it runs and which direction the data moves.

  Palette — canonical copy lives in tests/assets/brand.ts. These values are
  repeated here only because SVG cannot import; if they ever disagree with that
  file, that file is right.

  Every stop is a Tailwind teal. Teal, because this is plumbing rather than a shop feature, and plumbing should not shout.

  Rendered to PNG by tests/assets/wporg-brand.spec.ts — never hand-edit the
  PNGs. See .wordpress-org/BRAND.md.

  Author: Al Amin Ahamed
  License: GPL-2.0-or-later
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="WP Scheduled Data Fetch">
	<title>WP Scheduled Data Fetch</title>

	<defs>
		<linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%"   stop-color="#042f2e"/>
			<stop offset="40%"  stop-color="#134e4a"/>
			<stop offset="78%"  stop-color="#0d9488"/>
			<stop offset="100%" stop-color="#14b8a6"/>
		</linearGradient>

		<radialGradient id="highlight" cx="22%" cy="18%" r="70%">
			<stop offset="0%"   stop-color="#2dd4bf" stop-opacity="0.30"/>
			<stop offset="55%"  stop-color="#0d9488" stop-opacity="0.04"/>
			<stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
		</radialGradient>

		<linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
			<stop offset="34%"  stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>

		<radialGradient id="pool" cx="78%" cy="104%" r="72%">
			<stop offset="0%"   stop-color="#0d9488" stop-opacity="0.38"/>
			<stop offset="64%"  stop-color="#0d9488" stop-opacity="0"/>
		</radialGradient>

		<linearGradient id="glyph" x1="50%" y1="0%" x2="50%" y2="100%">
			<stop offset="0%"   stop-color="#ffffff"/>
			<stop offset="60%"  stop-color="#f0fdfa"/>
			<stop offset="100%" stop-color="#99f6e4"/>
		</linearGradient>
	</defs>

	<!-- Ground, highlight, refracted pool, specular sweep — the same stack
	     field() reproduces in CSS, so icon and banner catch the light alike. -->
	<rect width="256" height="256" rx="56" fill="url(#frame)"/>
	<rect width="256" height="256" rx="56" fill="url(#highlight)"/>
	<rect width="256" height="256" rx="56" fill="url(#pool)"/>
	<rect width="256" height="256" rx="56" fill="url(#specular)"/>

	<circle cx="120" cy="106" r="72" fill="none" stroke="url(#glyph)" stroke-width="20"/>
	<path d="M120 66 V110 L152 128" fill="none" stroke="url(#glyph)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
	<rect x="182" y="140" width="20" height="56" rx="10" fill="url(#glyph)"/>
	<path d="M166 186 L218 186 L192 224 Z" fill="url(#glyph)"/>
</svg>
